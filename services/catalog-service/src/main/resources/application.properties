spring.application.name=catalog-service
server.port=8082

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:catalog_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Shared secret for /api/internal/** (service-to-service)
internal.service-token=${INTERNAL_SERVICE_TOKEN:}

spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# API responses/requests are always snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE


# Upload ảnh: FPT S3 khi đủ cấu hình, thiếu thì lưu thư mục local (chỉ để dev)
fpt-s3.access-key-id=${S3_FPT_ACCESSKEY_ID:}
fpt-s3.secret-access-key=${S3_FPT_SECRET_ACCESS_KEY:}
fpt-s3.endpoint=${S3_FPT_ENDPOINT:}
fpt-s3.region=${S3_FPT_REGION:han02}
fpt-s3.bucket-name=${S3_FPT_BUCKET_NAME:}
fpt-s3.public-endpoint=${S3_FPT_PUBLIC_ENDPOINT:}
fpt-s3.limit-size-mb=${S3_FPT_LIMIT_SIZE_MB:10}
upload.local-dir=${LOCAL_UPLOAD_DIR:uploads}
upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:https://muong14.xyz}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
upload.video-limit-mb=${UPLOAD_VIDEO_LIMIT_MB:100}

# Tra tên đơn vị khi đăng bài
identity-service.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}

# Pool kết nối database nhỏ gọn: mặc định giữ 10 kết nối nhàn rỗi mỗi service, năm service là 50 kết nối đè lên MySQL dùng chung.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1500000

# Banner và bài viết demo cho giới thiệu app
demo.seed.enabled=${DEMO_SEED_ENABLED:false}

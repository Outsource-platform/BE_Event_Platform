spring.application.name=identity-service
server.port=8081

spring.config.import=optional:file:.env[.properties]

# DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:identity_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (secret must be identical across every service; only identity-service issues tokens)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Redis (session/cache)
spring.data.redis.url=${REDIS_URL:redis://localhost:6380}

spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=Asia/Ho_Chi_Minh


# First-run bootstrap super-admin (platform owner, tenant = null) — change the password after first login
bootstrap.super-admin.username=${SUPERADMIN_USERNAME:superadmin}
bootstrap.super-admin.password=${SUPERADMIN_PASSWORD:ChangeMe123!}

# Shared secret for /api/internal/** (service-to-service)
internal.service-token=${INTERNAL_SERVICE_TOKEN:}

# API responses/requests are always snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE

# Dọn dữ liệu người dùng ở service khác khi xoá tài khoản
customer-service.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8084}
notification-service.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
event-service.base-url=${EVENT_SERVICE_URL:http://localhost:8083}

# Pool kết nối database nhỏ gọn: mặc định giữ 10 kết nối nhàn rỗi mỗi service, năm service là 50 kết nối đè lên MySQL dùng chung.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1500000

# Dữ liệu demo (đơn vị lân sư rồng mẫu cùng tài khoản admin) để giới thiệu app; chỉ chạy khi bật cờ và có mật khẩu.
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.seed.admin-password=${DEMO_ADMIN_PASSWORD:}

# Khoá mã hoá dữ liệu nhạy cảm (số tài khoản ngân hàng). Bắt buộc, 32 byte dạng base64: `openssl rand -base64 32`.
# Mất khoá là mất dữ liệu đã mã hoá, nên sao lưu khoá riêng, không commit.
security.data-key=${DATA_ENCRYPTION_KEY:}

# MySQL is external (FPT / dedicated DB server) — set DB_HOST / DB_PORT in root .env.
# Create schemas once with: infra/mysql/local-create-databases.sql
#
# Build jars first: mvn -q -DskipTests package
# Then: docker compose up -d --build

x-app-env: &app-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-3306}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_URL: redis://redis:6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
  JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  IDENTITY_SERVICE_URL: http://identity-service:8081
  CATALOG_SERVICE_URL: http://catalog-service:8082
  EVENT_SERVICE_URL: http://event-service:8083
  CUSTOMER_SERVICE_URL: http://customer-service:8084
  NOTIFICATION_SERVICE_URL: http://notification-service:8085
  DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}

services:
  # Redis, RabbitMQ chỉ bind vào 127.0.0.1: trước đây mở ra internet (Redis không mật khẩu). Service trong compose
  # gọi nhau qua mạng Docker nên không cần cổng công khai; muốn xem giao diện RabbitMQ thì dùng SSH tunnel tới 15673.
  redis:
    image: redis:7-alpine
    container_name: event-platform-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: event-platform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-service:
    build: ./services/identity-service
    container_name: event-platform-identity-service
    restart: unless-stopped
    mem_limit: 448m
    environment:
      <<: *app-env
      DB_NAME: identity_db
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy

  catalog-service:
    build: ./services/catalog-service
    container_name: event-platform-catalog-service
    restart: unless-stopped
    mem_limit: 416m
    environment:
      <<: *app-env
      DB_NAME: catalog_db
      LOCAL_UPLOAD_DIR: /data/uploads
      S3_FPT_ACCESSKEY_ID: ${S3_FPT_ACCESSKEY_ID:-}
      S3_FPT_SECRET_ACCESS_KEY: ${S3_FPT_SECRET_ACCESS_KEY:-}
      S3_FPT_ENDPOINT: ${S3_FPT_ENDPOINT:-}
      S3_FPT_REGION: ${S3_FPT_REGION:-han02}
      S3_FPT_BUCKET_NAME: ${S3_FPT_BUCKET_NAME:-}
      S3_FPT_PUBLIC_ENDPOINT: ${S3_FPT_PUBLIC_ENDPOINT:-}
    # Ảnh, video chưa cấu hình S3 thì lưu local: gắn volume để build lại container không mất file.
    volumes:
      - catalog_uploads:/data/uploads

  event-service:
    build: ./services/event-service
    container_name: event-platform-event-service
    restart: unless-stopped
    mem_limit: 448m
    environment:
      <<: *app-env
      DB_NAME: event_db
    depends_on:
      rabbitmq:
        condition: service_healthy

  customer-service:
    build: ./services/customer-service
    container_name: event-platform-customer-service
    restart: unless-stopped
    mem_limit: 352m
    environment:
      <<: *app-env
      DB_NAME: customer_db

  notification-service:
    build: ./services/notification-service
    container_name: event-platform-notification-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *app-env
      DB_NAME: notification_db
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON}
      FCM_TOKEN_RETENTION_DAYS: ${FCM_TOKEN_RETENTION_DAYS:-90}
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    container_name: event-platform-api-gateway
    restart: unless-stopped
    mem_limit: 384m
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - catalog-service
      - event-service
      - customer-service
      - notification-service

volumes:
  redis_data:
  rabbitmq_data:
  catalog_uploads:
